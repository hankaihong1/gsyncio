name: Bug Report
description: Report a bug in multiloop
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior. Include a minimal code example if possible.
      placeholder: |
        ```python
        import multiloop

        # minimal reproduction snippet
        ```
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: I expected ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your runtime environment. This project requires Python 3.14t (free-threaded build).
      value: |
        - OS: [e.g. macOS 15, Ubuntu 24.04]
        - Python version: [e.g. 3.14.0t]
        - multiloop version: [e.g. 0.1.0]
        - Rust toolchain: [e.g. stable]
      render: markdown
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information, logs, or screenshots that might help.
      placeholder: Add anything else here.
