[package]
name = "multiloop-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "_multiloop_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29"
flume = "0.11"
parking_lot = "0.12"
httparse = "1.10.1"
h2 = "0.4.15"
http = "1.5.0"
bytes = "1.12.1"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync"] }
rustls = "0.23.43"
tokio-rustls = "0.26.4"

[build-dependencies]
pyo3-build-config = "0.29"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
test-init = ["pyo3/auto-initialize"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
